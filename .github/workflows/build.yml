name: Compile APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_ROOT=1
        yes | buildozer android debug || true

    - name: Copy APK to workspace root
      run: |
        find . -name "*.apk" -exec cp {} . \;
        ls -la

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: "*.apk"
        if-no-files-found: ignore
