name: Compile APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Buildozer
      run: |
        export BUILDOZER_ALLOW_ROOT=1
        buildozer -v android debug || buildozer android debug

    - name: Ultimate APK Search and Copy
      run: |
        echo "Buscando cualquier archivo APK en todo el sistema..."
        find / -name "*.apk" 2>/dev/null || true
        # Copiar cualquier APK encontrado a la raíz del workspace
        find / -name "*.apk" 2>/dev/null -exec cp {} . \;
        ls -la

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: |
          *.apk
          */*.apk
          bin/*.apk
        if-no-files-found: ignore
